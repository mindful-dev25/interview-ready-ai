# Render Blueprint: one Docker web service running the frontend and backend together (see Dockerfile).
# In Render, choose New > Blueprint, pick this repository, and fill in the secret values it asks for.
services:
  - type: web
    name: interview-ready-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Persistent disks need a paid instance type.
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Leave empty to let anyone with the URL use the app.
      - key: APP_PASSWORD
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
